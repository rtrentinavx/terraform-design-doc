<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7B2FBE" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Inner subtle glow -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="url(#glow)"/>

  <!-- ── Network topology (top half) ── -->
  <!-- Connection lines first (behind nodes) -->
  <!-- Hub to top-left spoke -->
  <line x1="256" y1="210" x2="148" y2="152" stroke="white" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Hub to top-right spoke -->
  <line x1="256" y1="210" x2="364" y2="152" stroke="white" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Hub to bottom-left spoke -->
  <line x1="256" y1="210" x2="148" y2="268" stroke="white" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Hub to bottom-right spoke -->
  <line x1="256" y1="210" x2="364" y2="268" stroke="white" stroke-width="6" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Central hub node -->
  <circle cx="256" cy="210" r="28" fill="white" opacity="0.95"/>
  <circle cx="256" cy="210" r="16" fill="url(#bg)"/>

  <!-- Spoke nodes -->
  <circle cx="148" cy="152" r="20" fill="white" opacity="0.85"/>
  <circle cx="364" cy="152" r="20" fill="white" opacity="0.85"/>
  <circle cx="148" cy="268" r="20" fill="white" opacity="0.85"/>
  <circle cx="364" cy="268" r="20" fill="white" opacity="0.85"/>

  <!-- ── Divider line ── -->
  <line x1="80" y1="316" x2="432" y2="316" stroke="white" stroke-width="2" stroke-opacity="0.3"/>

  <!-- ── Document lines (bottom half) ── -->
  <!-- Line 1 — full width -->
  <rect x="96" y="344" width="320" height="12" rx="6" fill="white" opacity="0.9"/>
  <!-- Line 2 — full width -->
  <rect x="96" y="372" width="280" height="12" rx="6" fill="white" opacity="0.7"/>
  <!-- Line 3 — shorter -->
  <rect x="96" y="400" width="200" height="12" rx="6" fill="white" opacity="0.5"/>
  <!-- Line 4 — shortest -->
  <rect x="96" y="428" width="140" height="12" rx="6" fill="white" opacity="0.35"/>
</svg>
