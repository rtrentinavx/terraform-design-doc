<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Hub node -->
  <circle cx="32" cy="28" r="7" fill="white" opacity="0.95"/>
  <circle cx="32" cy="28" r="4" fill="url(#bg)"/>

  <!-- Connection lines -->
  <line x1="32" y1="28" x2="16" y2="16" stroke="white" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="48" y2="16" stroke="white" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="16" y2="40" stroke="white" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="48" y2="40" stroke="white" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Spoke nodes -->
  <circle cx="16" cy="16" r="5" fill="white" opacity="0.85"/>
  <circle cx="48" cy="16" r="5" fill="white" opacity="0.85"/>
  <circle cx="16" cy="40" r="5" fill="white" opacity="0.85"/>
  <circle cx="48" cy="40" r="5" fill="white" opacity="0.85"/>

  <!-- Document lines -->
  <rect x="10" y="50" width="44" height="3" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="10" y="57" width="32" height="3" rx="1.5" fill="white" opacity="0.6"/>
</svg>
