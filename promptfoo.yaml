description: "Terraform HLD Generator — prompt regression & versioning tests"

# ── Providers ──────────────────────────────────────────────────────────────
providers:
  - id: anthropic:claude-sonnet-4-20250514
    config:
      temperature: 0
      max_tokens: 16000

# ── Prompt versions ────────────────────────────────────────────────────────
# Add new entries here when iterating on the system prompt.
# Run: npm run test:prompts          — test current prompt only
# Run: npm run test:prompts:compare  — compare all versions side-by-side
prompts:
  - id: file://lib/systemPrompt.ts
    label: "v2 (current) — universal Terraform"
  - id: file://prompts/v1-aviatrix.ts
    label: "v1 — Aviatrix-focused (baseline)"

# ── Shared test config ─────────────────────────────────────────────────────
defaultTest:
  options:
    provider: anthropic:claude-sonnet-4-20250514

# ── Test suite ─────────────────────────────────────────────────────────────
tests:
  # ── Firewall detection: explicit image string ──────────────────────────
  - description: "AWS FireNet — Palo Alto Bundle 1 (hardcoded image)"
    vars:
      terraform_content: "{{file://test/fixtures/aws-firenet-palo.tf}}"
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_detail?.present === true;
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return (d.firewall_detail?.vendor || '').toLowerCase().includes('palo');
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_detail?.license_model === 'PAYG';
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_detail?.instance_size === 'c5.xlarge';
        threshold: 1

  # ── Firewall detection: variable resolved from tfvars ─────────────────
  - description: "AWS FireNet — Palo Alto via tfvars variable resolution"
    vars:
      terraform_content: |
        ### RESOLVED VARIABLES (from tfvars)
        firewall_image = "Palo Alto Networks VM-Series Next-Generation Firewall Bundle 1"
        fw_amount = "2"
        fw_instance_size = "c5.xlarge"

        ### FILE: main.tf
        ```hcl
        {{file://test/fixtures/aws-firenet-tfvars.tf}}
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_detail?.present === true;
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return (d.firewall_detail?.vendor || '').toLowerCase().includes('palo');
        threshold: 1

  # ── Anti-hallucination: no firewall invented ───────────────────────────
  - description: "Plain AWS VPC — must NOT invent firewall"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        {{file://test/fixtures/no-firewall.tf}}
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_detail?.present === false;
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.firewall_vendor === 'none' || d.firewall_vendor === 'unknown';
        threshold: 1

  # ── Anti-hallucination: no spokes without mc-spoke ─────────────────────
  - description: "Transit only — no spoke VPCs without mc-spoke module"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        module "mc-transit" {
          source  = "terraform-aviatrix-modules/mc-transit/aviatrix"
          version = "2.5.0"
          cloud   = "AWS"
          region  = "us-east-1"
          cidr    = "10.1.0.0/23"
          account = "aws-prod"
          gw_name = "aws-transit-only"
        }
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          const spokes = (d.network_design?.vpcs || []).filter(v => v.type === 'spoke');
          return spokes.length === 0;
        threshold: 1

  # ── Provider detection ─────────────────────────────────────────────────
  - description: "AWS provider detected correctly"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        {{file://test/fixtures/aws-firenet-palo.tf}}
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.provider === 'aws';
        threshold: 1

  # ── Schema completeness ────────────────────────────────────────────────
  - description: "All required top-level HLD fields present"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        {{file://test/fixtures/aws-firenet-palo.tf}}
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          const required = ['title','version','date','provider','executive_summary',
            'architecture_overview','network_design','security','firewall_detail','dcf'];
          return required.every(k => k in d);
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return typeof d.title === 'string' && d.title.length > 0;
        threshold: 1

  # ── Caveats populated for inferred values ──────────────────────────────
  - description: "Caveats array populated when gateway size uses defaults"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        module "mc-transit" {
          source  = "terraform-aviatrix-modules/mc-transit/aviatrix"
          version = "2.5.0"
          cloud   = "AWS"
          region  = "us-east-1"
          cidr    = "10.1.0.0/23"
          account = "aws-prod"
          gw_name = "aws-transit-defaults"
        }
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return Array.isArray(d.caveats);
        threshold: 1
      - type: javascript
        value: |
          const d = JSON.parse(output);
          // Should have at least one caveat about defaults or sizing
          return d.caveats?.length > 0;
        threshold: 0.8

  # ── No hallucinated vendor ─────────────────────────────────────────────
  - description: "Unresolved firewall_image — vendor must be unknown, not fabricated"
    vars:
      terraform_content: |
        ### FILE: main.tf
        ```hcl
        module "mc-firenet" {
          source         = "terraform-aviatrix-modules/mc-firenet/aviatrix"
          version        = "1.5.0"
          transit_module = module.mc-transit
          firewall_image = var.firewall_image
        }
        ```
    assert:
      - type: javascript
        value: |
          const d = JSON.parse(output);
          // vendor must not be a made-up value — should be unknown if unresolvable
          const vendor = (d.firewall_detail?.vendor || '').toLowerCase();
          // Either explicitly unknown OR a legitimate vendor detected from context
          return vendor === 'unknown' || vendor === '' ||
                 vendor.includes('palo') || vendor.includes('forti') || vendor.includes('check');
        threshold: 1
